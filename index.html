<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anyely 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #1a002b, #3a0066);
  color: white;
  text-align: center;
}

#inicio {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
}

#inicio button {
  padding: 20px;
  font-size: 20px;
  border-radius: 15px;
  border: none;
  background: #ff4b5c;
  color: white;
}

#contenido {
  display: none;
  padding: 20px;
}

button {
  margin: 10px;
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  background: #ff4b5c;
  color: white;
}

.card {
  display: none;
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
  margin: 20px auto;
  max-width: 300px;
}
</style>
</head>

<body>

<div id="inicio">
  <button id="btnStart">🎁 Abrir sorpresa</button>
</div>

<div id="contenido">
  <h1>🎉 Feliz Cumpleaños Anyely 🎉</h1>
  <p>De Ronaldo 💖</p>

  <button id="btnMensaje">💌 Ver mensaje</button>
  <button id="btnMusica">🎵 Música</button>

  <div class="card" id="card">
    <p>
      Anyely 💖<br><br>
      Hoy es un día especial ✨<br>
      Mereces lo mejor del mundo 🌍<br><br>
      Nunca dejes de sonreír 😊<br><br>
      — Ronaldo 💌
    </p>
  </div>
</div>

<!-- AUDIO -->
<audio id="music" preload="auto"></audio>

<script>
// ELEMENTOS
const btnStart = document.getElementById("btnStart");
const contenido = document.getElementById("contenido");
const inicio = document.getElementById("inicio");
const card = document.getElementById("card");
const music = document.getElementById("music");

// PLAYLIST
const canciones = [
  "https://cdn.pixabay.com/audio/2023/03/20/audio_9a9f5c13cb.mp3",
  "https://cdn.pixabay.com/audio/2022/03/15/audio_3b2d7f0f4c.mp3"
];

let indice = 0;
let cargada = false;

// CARGAR DESDE EL INICIO
function prepararAudio() {
  music.src = canciones[indice];
  music.load();
  cargada = true;
}

// INICIAR
btnStart.addEventListener("click", () => {
  inicio.style.display = "none";
  contenido.style.display = "block";
  prepararAudio();
});

// MENSAJE
document.getElementById("btnMensaje").addEventListener("click", () => {
  card.style.display = "block";
});

// SIGUIENTE CANCIÓN
music.addEventListener("ended", () => {
  indice = (indice + 1) % canciones.length;
  music.src = canciones[indice];
  music.play().catch(()=>{});
});

// BOTÓN MÚSICA
document.getElementById("btnMusica").addEventListener("click", () => {

  if (!cargada) {
    prepararAudio();
  }

  if (music.paused) {
    music.play().catch(() => {
      alert("Toca otra vez el botón 🔊");
    });
  } else {
    music.pause();
  }

});
</script>

</body>
</html>
