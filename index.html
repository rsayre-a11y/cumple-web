<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Anyely 💖</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1a002b, #3a0066);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* PANTALLA INICIAL */
#inicio {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #000, #1a002b);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

#inicio button {
  padding: 20px 30px;
  font-size: 20px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(45deg, #ff4b5c, #ff7eb3);
  color: white;
  box-shadow: 0 0 20px #ff4b5c;
}

/* CONTENIDO */
.container {
  display: none;
  padding: 20px;
}

h1 {
  margin-top: 30px;
  font-size: 36px;
}

.sub {
  color: #ffc0cb;
}

/* TARJETA */
.card {
  margin: 20px auto;
  max-width: 320px;
  padding: 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 20px rgba(255,255,255,0.2);
  display: none;
}

/* BOTONES */
button {
  margin: 10px;
  padding: 12px 20px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(45deg, #ff4b5c, #ff7eb3);
  color: white;
  font-size: 16px;
  box-shadow: 0 0 10px #ff4b5c;
}

/* CORAZONES */
.heart {
  position: fixed;
  font-size: 20px;
  animation: subir 6s linear;
}

@keyframes subir {
  from {transform: translateY(0);}
  to {transform: translateY(-110vh);}
}

/* CONFETI */
.confeti {
  position: fixed;
  width: 6px;
  height: 6px;
  top: -10px;
  animation: caer linear forwards;
}

@keyframes caer {
  to {transform: translateY(110vh);}
}
</style>
</head>

<body>

<!-- INICIO -->
<div id="inicio">
  <button onclick="iniciar()">🎁 Abrir sorpresa</button>
</div>

<!-- CONTENIDO -->
<div class="container" id="contenido">

<h1>🎉 Feliz Cumpleaños Anyely 🎉</h1>
<p class="sub">De Ronaldo 💖</p>

<button onclick="mostrarMensaje()">💌 Ver mensaje</button>
<button onclick="toggleMusic()">🎵 Música</button>

<div class="card" id="card">
  <p>
    Anyely 💖<br><br>
    Hoy es un día especial ✨<br>
    Mereces lo mejor del mundo 🌍<br><br>
    Que nunca te falte una sonrisa 😊<br>
    ni motivos para ser feliz 🥳<br><br>
    Sigue brillando siempre 🌟<br><br>
    — Ronaldo 💌
  </p>
</div>

</div>

<!-- MÚSICA (más alegre) -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_3b2d7f0f4c.mp3">
</audio>

<script>
// INICIO
function iniciar() {
  document.getElementById("inicio").style.display = "none";
  document.getElementById("contenido").style.display = "block";
  lanzarConfeti();
}

// MOSTRAR MENSAJE
function mostrarMensaje() {
  document.getElementById("card").style.display = "block";
  lanzarConfeti();
}

// MÚSICA
let music = document.getElementById("music");
function toggleMusic() {
  if (music.paused) {
    music.play();
  } else {
    music.pause();
  }
}

// CONFETI
function lanzarConfeti() {
  for (let i = 0; i < 80; i++) {
    let c = document.createElement("div");
    c.className = "confeti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = ["#ff4b5c","#ffd166","#06d6a0","#118ab2"][Math.floor(Math.random()*4)];
    c.style.animationDuration = (Math.random()*3 + 2) + "s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

// CORAZONES
setInterval(()=>{
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random()*100 + "vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}, 700);

// CLICK = CONFETI
document.addEventListener("click", lanzarConfeti);
</script>

</body>
</html>
