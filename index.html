<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anyely 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f0014, #2b0033);
  color: white;
  text-align: center;
}

/* INICIO */
#inicio {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
}

#inicio button {
  padding: 20px;
  font-size: 20px;
  border-radius: 15px;
  border: none;
  background: #ff4b5c;
  color: white;
}

/* CONTENIDO */
.container {
  display: none;
  padding: 20px;
}

button {
  margin: 10px;
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  background: #ff4b5c;
  color: white;
}

.card {
  display: none;
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
  margin: 20px auto;
  max-width: 300px;
}
</style>
</head>

<body>

<!-- PANTALLA INICIAL -->
<div id="inicio">
  <button onclick="iniciar()">🎁 Abrir sorpresa</button>
</div>

<!-- CONTENIDO -->
<div class="container" id="contenido">

<h1>🎉 Feliz Cumpleaños Anyely 🎉</h1>
<p>De Ronaldo 💖</p>

<button onclick="verMensaje()">💌 Ver mensaje</button>
<button onclick="toggleMusica()">🎵 Música</button>

<div class="card" id="card">
  <p>
    Anyely 💖<br><br>
    Hoy es un día muy especial ✨<br>
    Espero que todo lo bonito llegue a tu vida 🥳<br><br>
    Nunca dejes de sonreír 🌟<br><br>
    — Ronaldo 💌
  </p>
</div>

</div>

<!-- AUDIO -->
<audio id="voz">
  <source src="voz1.mp3" type="audio/mpeg">
</audio>

<audio id="musica" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
let voz = document.getElementById("voz");
let musica = document.getElementById("musica");

// INICIAR
function iniciar() {
  document.getElementById("inicio").style.display = "none";
  document.getElementById("contenido").style.display = "block";

  // Reproducir voz (esto sí funciona porque es por clic)
  voz.play().catch(() => {
    alert("Toca el botón de música si no suena 🔊");
  });

  // Cuando termina la voz → empieza música
  voz.onended = function() {
    musica.volume = 0.2;
    musica.play().catch(() => {});
  };
}

// BOTÓN MÚSICA
function toggleMusica() {
  if (!voz.paused) {
    voz.pause();
  }

  if (musica.paused) {
    musica.play();
  } else {
    musica.pause();
  }
}

// MENSAJE
function verMensaje() {
  document.getElementById("card").style.display = "block";
}
</script>

</body>
</html>
