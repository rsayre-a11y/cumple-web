<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anyely 💖</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f0014, #2b0033);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* PANTALLA INICIAL */
#inicio {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

#inicio button {
  padding: 20px 30px;
  font-size: 20px;
  border: none;
  border-radius: 15px;
  background: #ff4b5c;
  color: white;
}

/* CONTENIDO */
.container {
  display: none;
  padding: 20px;
}

h1 {
  margin-top: 30px;
}

.sub {
  color: #ffb3c6;
}

/* FOTO */
img {
  width: 200px;
  border-radius: 20px;
  margin-top: 20px;
}

/* BOTONES */
button {
  margin: 10px;
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  background: #ff4b5c;
  color: white;
}

/* CARTA */
.card {
  max-width: 320px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 15px;
  background: rgba(255,255,255,0.1);
  display: none;
}

/* CORAZONES */
.heart {
  position: fixed;
  font-size: 18px;
  animation: subir 6s linear;
}

@keyframes subir {
  from {transform: translateY(0);}
  to {transform: translateY(-100vh);}
}

/* CONFETI */
.confeti {
  position: fixed;
  width: 6px;
  height: 6px;
  top: -10px;
  animation: caer linear forwards;
}

@keyframes caer {
  to {transform: translateY(110vh);}
}
</style>
</head>

<body>

<!-- PANTALLA INICIAL -->
<div id="inicio">
  <button onclick="iniciar()">🎁 Abrir sorpresa</button>
</div>

<!-- CONTENIDO -->
<div class="container" id="contenido">

<h1>🎉 Feliz Cumpleaños Anyely 🎉</h1>
<p class="sub">De Ronaldo 💖</p>

<img src="https://cdn.pixabay.com/photo/2017/01/31/13/14/birthday-2024765_1280.png">

<h3 id="texto"></h3>

<button onclick="verMensaje()">💌 Ver mensaje</button>
<button onclick="toggleMusic()">🎵 Música</button>

<div class="card" id="card">
  <p>
    Anyely 💖<br><br>
    Hoy celebramos lo increíble que eres ✨<br>
    Que cada día esté lleno de felicidad 🥳<br><br>
    Nunca dejes de brillar 🌟<br><br>
    Con mucho cariño,<br>
    Ronaldo 💌
  </p>
</div>

</div>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>
// INICIO
function iniciar() {
  document.getElementById("inicio").style.display = "none";
  document.getElementById("contenido").style.display = "block";
  escribir();
  lanzarConfeti();
}

// TEXTO
let mensaje = "Hoy es un día muy especial 🎂✨";
let i = 0;
function escribir() {
  if (i < mensaje.length) {
    document.getElementById("texto").innerHTML += mensaje[i];
    i++;
    setTimeout(escribir, 60);
  }
}

// MENSAJE
function verMensaje() {
  document.getElementById("card").style.display = "block";
  lanzarConfeti();
}

// MÚSICA
let music = document.getElementById("music");
function toggleMusic() {
  music.paused ? music.play() : music.pause();
}

// CONFETI
function lanzarConfeti() {
  for (let i = 0; i < 80; i++) {
    let c = document.createElement("div");
    c.className = "confeti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = ["#ff4b5c","#ffd166","#06d6a0","#118ab2"][Math.floor(Math.random()*4)];
    c.style.animationDuration = (Math.random()*3 + 2) + "s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

// CORAZONES
setInterval(()=>{
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random()*100 + "vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}, 800);

// CLICK
document.addEventListener("click", lanzarConfeti);
</script>

</body>
</html>
