<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anyely 💖</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f0014, #2b0033);
  color: white;
  text-align: center;
}

/* INICIO */
#inicio {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
}

#inicio button {
  padding: 20px;
  font-size: 20px;
  border-radius: 15px;
  border: none;
  background: #ff4b5c;
  color: white;
}

/* CONTENIDO */
.container {
  display: none;
  padding: 20px;
}

button {
  margin: 10px;
  padding: 10px 20px;
  border-radius: 10px;
  border: none;
  background: #ff4b5c;
  color: white;
}

.card {
  display: none;
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
  margin: 20px auto;
  max-width: 300px;
}

/* CONFETI */
.confeti {
  position: fixed;
  width: 6px;
  height: 6px;
  top: -10px;
  animation: caer linear forwards;
}

@keyframes caer {
  to {transform: translateY(110vh);}
}
</style>
</head>

<body>

<div id="inicio">
  <button onclick="iniciar()">🎁 Abrir sorpresa</button>
</div>

<div class="container" id="contenido">

<h1>🎉 Feliz Cumpleaños Anyely 🎉</h1>
<p>De Ronaldo 💖</p>

<button onclick="verMensaje()">💌 Ver mensaje</button>

<div class="card" id="card">
  <p>
    Anyely 💖<br><br>
    Hoy es un día muy especial ✨<br>
    Espero que todo lo bonito llegue a tu vida 🥳<br><br>
    Nunca dejes de sonreír 🌟<br><br>
    — Ronaldo 💌
  </p>
</div>

</div>

<!-- AUDIO -->
<audio id="voz">
  <source src="voz1.mp3">
</audio>

<audio id="musica" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>
// INICIO
function iniciar() {
  document.getElementById("inicio").style.display = "none";
  document.getElementById("contenido").style.display = "block";

  let voz = document.getElementById("voz");
  let musica = document.getElementById("musica");

  voz.play();

  // cuando termina tu voz
  voz.onended = function() {
    musica.volume = 0;
    musica.play();

    // fade in de música
    let vol = 0;
    let subir = setInterval(() => {
      if (vol < 1) {
        vol += 0.05;
        musica.volume = vol;
      } else {
        clearInterval(subir);
      }
    }, 200);
  };
}

// MENSAJE
function verMensaje() {
  document.getElementById("card").style.display = "block";
  lanzarConfeti();
}

// CONFETI
function lanzarConfeti() {
  for (let i = 0; i < 60; i++) {
    let c = document.createElement("div");
    c.className = "confeti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = ["red","yellow","blue","white"][Math.floor(Math.random()*4)];
    c.style.animationDuration = (Math.random()*3 + 2) + "s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}
</script>

</body>
</html>
